name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Optional at build time — only /api/contact reads them at runtime.
      RESEND_API_KEY: ''
      CONTACT_TO: ''
      TURNSTILE_SECRET_KEY: ''
      PUBLIC_TURNSTILE_SITE_KEY: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        # TODO: make this blocking once the eslint backlog is clean.
        continue-on-error: true
        run: npm run lint

      - name: Test
        run: npm test -- --passWithNoTests

      - name: Build (astro check + astro build)
        run: npm run build
