name: IndexNow

# After each push to main, wait for Vercel's production deploy of that commit,
# then tell Bing (and the other IndexNow engines) which pages changed.
# See frontend/scripts/indexnow.mjs.
# (Triggered by push, not deployment_status: the cache that remembers the page
# hashes only works on events tied to a branch.)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    name: submit changed pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Last run's page hashes, so only changed pages are submitted.
      - name: Restore previous state
        uses: actions/cache@v4
        with:
          path: frontend/.indexnow-state.json
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-

      - name: Wait for the production deploy of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=pending
          for i in $(seq 1 40); do
            state=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/status" --jq '[.statuses[] | select(.context == "Vercel")][0].state // "pending"')
            echo "Vercel: $state"
            if [ "$state" = "success" ]; then break; fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then exit 1; fi
            sleep 15
          done
          if [ "$state" != "success" ]; then echo "Deploy not ready after 10 min"; exit 1; fi
          sleep 20

      - name: Submit
        run: node scripts/indexnow.mjs
        env:
          INDEXNOW_STATE: .indexnow-state.json
